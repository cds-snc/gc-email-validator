name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Recompile domain snapshot
        run: |
          cargo run --locked -p domain-compiler
          rustfmt crates/api/src/generated_domains.rs

      - name: Verify generated files are current
        run: git diff --exit-code -- crates/api/src/generated_domains.rs data/manifest.json

  infrastructure:
    name: Terraform and Terragrunt checks
    runs-on: ubuntu-latest
    env:
      TERRAGRUNT_VERSION: 1.1.4
      TERRAGRUNT_SHA256: a2640da8455fa5f3671167e6373832b0907b9dc972dd01c2093cc7808934e158
      TG_AWS_ACCOUNT_ID: "000000000000"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8

      - name: Verify formatting
        run: terraform fmt -check -recursive

      - name: Install Terragrunt
        run: |
          binary="terragrunt_linux_amd64"
          curl --fail --location --show-error --silent \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/${binary}" \
            --output "/tmp/${binary}"
          echo "${TERRAGRUNT_SHA256}  /tmp/${binary}" | sha256sum --check
          sudo install -m 0755 "/tmp/${binary}" /usr/local/bin/terragrunt

      - name: Verify Terragrunt formatting and configuration
        run: |
          terragrunt hcl format --check --working-dir terragrunt
          terragrunt hcl validate --working-dir terragrunt

      - name: Initialize Lambda unit through Terragrunt
        working-directory: terragrunt/lambda
        run: terragrunt run init --non-interactive -- -backend=false

      - name: Validate Lambda unit through Terragrunt
        working-directory: terragrunt/lambda
        run: terragrunt run validate --non-interactive --no-auto-init

      - name: Initialize Lambda module
        run: terraform -chdir=aws/lambda init -backend=false -lockfile=readonly

      - name: Validate Lambda module
        run: terraform -chdir=aws/lambda validate
