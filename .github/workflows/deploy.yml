name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  CARGO_LAMBDA_VERSION: 1.9.2
  CARGO_LAMBDA_SHA256: b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d
  CARGO_TERM_COLOR: always
  TERRAGRUNT_VERSION: 1.1.4
  TERRAGRUNT_SHA256: a2640da8455fa5f3671167e6373832b0907b9dc972dd01c2093cc7808934e158
  TERRAFORM_VERSION: 1.15.8
  ZIG_VERSION: 0.15.2
  ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Reject bootstrap data
        run: test "$(jq --raw-output '.source.sourceCommit' data/manifest.json)" != "bootstrap"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0

      - name: Install cargo-lambda
        run: |
          archive="cargo-lambda-v${CARGO_LAMBDA_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --show-error --silent \
            "https://github.com/cargo-lambda/cargo-lambda/releases/download/v${CARGO_LAMBDA_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${CARGO_LAMBDA_SHA256}  /tmp/${archive}" | sha256sum --check
          tar --extract --gzip --file "/tmp/${archive}" cargo-lambda
          sudo install -m 0755 cargo-lambda /usr/local/bin/cargo-lambda

      - name: Install Zig cross-linker
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl --fail --location --show-error --silent \
            "https://ziglang.org/download/${ZIG_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${ZIG_SHA256}  /tmp/${archive}" | sha256sum --check
          sudo mkdir /opt/zig
          sudo tar --extract --xz --file "/tmp/${archive}" --directory /opt/zig --strip-components=1
          sudo ln --symbolic /opt/zig/zig /usr/local/bin/zig

      - name: Build Lambda package
        run: |
          cargo lambda build --locked --release --arm64 --package gc-email-validator --output-format zip
          mkdir -p build
          cp target/lambda/gc-email-validator/bootstrap.zip build/lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Terragrunt
        run: |
          binary="terragrunt_linux_amd64"
          curl --fail --location --show-error --silent \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/${binary}" \
            --output "/tmp/${binary}"
          echo "${TERRAGRUNT_SHA256}  /tmp/${binary}" | sha256sum --check
          sudo install -m 0755 "/tmp/${binary}" /usr/local/bin/terragrunt

      - name: Apply Terragrunt unit
        env:
          TG_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          TG_AWS_REGION: ${{ vars.AWS_REGION }}
          TG_ENVIRONMENT: production
          TG_LAMBDA_ZIP_PATH: ${{ github.workspace }}/build/lambda.zip
          TG_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        working-directory: terragrunt/lambda
        run: terragrunt run apply --backend-require-bootstrap --non-interactive -- -auto-approve -input=false

      - name: Read endpoint
        id: endpoint
        env:
          TG_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          TG_AWS_REGION: ${{ vars.AWS_REGION }}
          TG_ENVIRONMENT: production
          TG_LAMBDA_ZIP_PATH: ${{ github.workspace }}/build/lambda.zip
          TG_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        working-directory: terragrunt/lambda
        run: echo "url=$(terragrunt run output --non-interactive -- -raw api_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Publish endpoint summary
        run: echo "### Endpoint ${{ steps.endpoint.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
