name: Refresh domain data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: domain-data-refresh
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPDATE_BRANCH: automation/domain-data-refresh

jobs:
  refresh:
    name: Refresh and propose changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Download, verify, and compile upstream data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/refresh-data.sh

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package patch version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          current_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "gc-email-validator") | .version')"
          if [[ ! "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic package version, got ${current_version}" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${current_version}"
          next_version="${major}.${minor}.$((patch + 1))"
          sed --in-place \
            "0,/^version = \"${current_version}\"$/s//version = \"${next_version}\"/" \
            crates/api/Cargo.toml
          grep --fixed-strings --line-regexp \
            "version = \"${next_version}\"" \
            crates/api/Cargo.toml
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Refresh lockfile package version
        if: steps.changes.outputs.changed == 'true'
        run: cargo check --workspace

      - name: Test refreshed data
        run: cargo test --locked --workspace --all-targets

      - name: Commit update branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add data/upstream data/manifest.json crates/api/src/generated_domains.rs crates/api/Cargo.toml Cargo.lock
          git commit -m "chore(data): refresh Government of Canada domains"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

      - name: Run CI on update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$UPDATE_BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_body="Automated refresh of the three data files from one pinned gcorg-resolver commit and patch version bump to v${{ steps.version.outputs.version }}. Review the generated manifest and domain diff before merging."
          if gh pr view "$UPDATE_BRANCH" >/dev/null 2>&1; then
            gh pr edit \
              "$UPDATE_BRANCH" \
              --title "chore(data): refresh Government of Canada domains" \
              --body "$pr_body"
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore(data): refresh Government of Canada domains" \
              --body "$pr_body"
          fi
