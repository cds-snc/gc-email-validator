[workspace]
members = ["crates/api", "crates/domain-compiler"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
csv = "1.3.1"
idna = "1.1.0"
lambda_http = { version = "1.3.0", default-features = false, features = ["apigw_http"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

